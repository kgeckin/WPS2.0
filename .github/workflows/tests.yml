name: Local Awareness Lab Tests

on:
  push:
    branches: [main, refactor/unified-awareness-lab]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile maintained Python modules
        run: python -m compileall -q main.py wps_lab tests
      - name: Run security and integration regression tests
        run: python -m pytest -q tests
